server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container (service name "backend").
    # No trailing slash on proxy_pass -> the full /api/... path is forwarded.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # Monte-Carlo simulate can take a few seconds
    }

    # SPA fallback so client-side routing / refresh works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
