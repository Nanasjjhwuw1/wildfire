# One-command stack:  docker compose up --build
#   frontend (nginx)  -> http://localhost:8080   (serves the app, proxies /api)
#   backend  (uvicorn)-> http://localhost:8000   (FastAPI, also exposed directly)
#
# Values like FIRMS_API_KEY / DATA_MODE / BBOX_* are read from a local .env
# (copy .env.example to .env). Missing .env just uses the defaults below.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATA_MODE=${DATA_MODE:-real}
      - FIRMS_API_KEY=${FIRMS_API_KEY:-}
      - AREA_NAME=${AREA_NAME:-Doi Suthep, Chiang Mai}
      - BBOX_LON_MIN=${BBOX_LON_MIN:-98.85}
      - BBOX_LAT_MIN=${BBOX_LAT_MIN:-18.74}
      - BBOX_LON_MAX=${BBOX_LON_MAX:-98.95}
      - BBOX_LAT_MAX=${BBOX_LAT_MAX:-18.84}
      - CELL_SIZE_M=${CELL_SIZE_M:-100}
    volumes:
      # Persist fetched data so prefetched caches survive restarts / enable offline demo.
      - ./backend/cache:/app/backend/cache
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
